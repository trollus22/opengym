name: opengym

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC).
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Username/password auth + per-user data (Node, no framework).
  # image: prebuilt (docker compose pull). build: from source (docker compose up --build).
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
      - COACH_CODEX_HOME=/codex
    volumes:
      - ./data:/data         # session secret, VAPID keys, Coach config, legacy JSON backups
      # ChatGPT/Codex refresh tokens are kept separate from app data and mounted only into the
      # API container. This directory is owned by the unprivileged Coach runtime.
      - ./data/codex:/codex
    networks:
      - default
      # Users, per-profile state, push subscriptions and invites live in Postgres — the Supabase
      # stack already running on this box. Joining its network means the API reaches the database
      # by service name: nothing extra is published, and no Supabase API key is involved.
      - supabase

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for the app and the API.
  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro

networks:
  # The Supabase stack this instance stores its users and state in. Created by that stack's own
  # compose file, so it is referenced rather than owned here.
  supabase:
    external: true
    name: supabase_default
